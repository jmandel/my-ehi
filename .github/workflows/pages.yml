name: Deploy deep dives to GitHub Pages

# Builds the static deep-dive site and publishes it. GitHub Pages serves a project site at
# https://<user>.github.io/<repo>/ (or your custom domain at /<repo>/ when mapped), i.e. a SUBPATH —
# build-site.ts emits only relative paths, so the same artifact is correct at root or under /<repo>/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Assemble static site
        run: bun skills/ehi-deep-dives/scripts/build-site.ts deep-dives site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
